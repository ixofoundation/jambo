name: E2E

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Run against an already-deployed URL instead of building locally'
        required: false
        type: string

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: Run E2E
        run: yarn test:e2e
        env:
          # Empty unless dispatched with a URL, in which case the config switches
          # to the `deployed` project and skips building.
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

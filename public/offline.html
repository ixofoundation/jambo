<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5eb" />
    <title>You're offline · JAMBO yoma</title>
    <!-- Shown by the service worker (sw/sw.js) when a page can't load and no copy is saved.
         Self-contained: no scripts or styles from the network. -->
    <style>
      :root {
        --bg: #f7f5eb;
        --card: #ffffff;
        --ink: #23202a;
        --ink-2: #5b5860;
        --brand: #54365d;
        --action: #387f6a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: Nunito, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 400px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        margin: 0 auto;
        border-radius: 22px;
      }
      h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 800;
        color: var(--brand);
      }
      p {
        margin: 0;
        font-size: 16px;
        line-height: 1.5;
        color: var(--ink-2);
      }
      button {
        min-height: 48px;
        padding: 12px 28px;
        border: 0;
        border-radius: 999px;
        background: var(--action);
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid var(--brand);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>This page isn't saved on your phone yet. When you have signal again, try once more.</p>
      <p>Anything you typed into a claim form is saved as a draft.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Go back to the page as soon as the connection returns.
      window.addEventListener('online', function () {
        location.reload();
      });
    </script>
  </body>
</html>
